# Ciągła integracja: przy każdym pushu i pull requeście do main
# sprawdzamy jakość kodu (ruff) i uruchamiamy testy (pytest).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pobranie kodu repozytorium
      - uses: actions/checkout@v4

      # Instalacja Pythona 3.12 z cache pakietów pip (szybsze kolejne uruchomienia)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Instalacja zależności projektu wraz z narzędziami deweloperskimi
      - name: Instalacja zależności
        run: pip install -r requirements-dev.txt

      # Analiza statyczna kodu
      - name: Ruff
        run: ruff check .

      # Testy automatyczne
      - name: Pytest
        run: pytest

  # Sprawdzenie, czy obraz Dockera się buduje i serwer w kontenerze odpowiada.
  docker:
    runs-on: ubuntu-latest
    needs: test  # uruchamiane dopiero po przejściu testów
    steps:
      - uses: actions/checkout@v4

      - name: Budowa obrazu
        run: docker build -t fitness-ai .

      # Start kontenera i odpytanie /health (do 30 prób co sekundę)
      - name: Test kontenera
        run: |
          docker run -d --name api -p 8000:8000 fitness-ai
          curl --retry 30 --retry-all-errors --retry-delay 1 --fail http://localhost:8000/health
          curl --fail http://localhost:8000/api/v1/exercises?limit=1
