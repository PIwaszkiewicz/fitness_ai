# Ciągła integracja i wdrażanie (CI/CD):
# - przy każdym pull requeście i pushu do main: ruff, pytest, budowa i test obrazu Dockera,
# - po pushu do main (czyli po scaleniu PR) i przejściu testów: wdrożenie na Render.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # ręczne uruchomienie z zakładki Actions

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pobranie kodu repozytorium
      - uses: actions/checkout@v4

      # Instalacja Pythona 3.12 z cache pakietów pip (szybsze kolejne uruchomienia)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Instalacja zależności projektu wraz z narzędziami deweloperskimi
      - name: Instalacja zależności
        run: pip install -r requirements-dev.txt

      # Analiza statyczna kodu
      - name: Ruff
        run: ruff check .

      # Testy automatyczne
      - name: Pytest
        run: pytest

      # Sprawdzenie składni JavaScriptu frontendu (Node.js jest dostępny w maszynie CI)
      - name: Składnia JavaScript
        run: node --check app/static/app.js

  # Sprawdzenie, czy obraz Dockera się buduje i serwer w kontenerze odpowiada.
  docker:
    runs-on: ubuntu-latest
    needs: test  # uruchamiane dopiero po przejściu testów
    steps:
      - uses: actions/checkout@v4

      - name: Budowa obrazu
        run: docker build -t fitness-ai .

      # Start kontenera i odpytanie /health (do 30 prób co sekundę)
      - name: Test kontenera
        run: |
          docker run -d --name api -p 8000:8000 fitness-ai
          curl --retry 30 --retry-all-errors --retry-delay 1 --fail http://localhost:8000/health
          curl --fail http://localhost:8000/api/v1/exercises?limit=1

  # Wdrożenie na Render: tylko dla gałęzi main i tylko po przejściu testów i budowy obrazu.
  deploy:
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      url: ${{ vars.RENDER_APP_URL }}
    steps:
      # Adres wywołujący wdrożenie (deploy hook) jest sekretem: kto go zna, może wdrażać.
      - name: Wdrożenie i oczekiwanie na nową wersję
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ] || [ -z "$APP_URL" ]; then
            echo "::warning::Brak konfiguracji Render (sekret RENDER_DEPLOY_HOOK_URL lub zmienna RENDER_APP_URL), pomijam wdrożenie."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Wdrożenie uruchomione, czekam na wersję $GITHUB_SHA"
          # Darmowy serwer buduje obraz kilka minut: sprawdzamy /health co 15 s, maksymalnie 20 minut.
          for attempt in $(seq 1 80); do
            if curl --silent "$APP_URL/health" | grep -q "$GITHUB_SHA"; then
              echo "Serwer działa na nowej wersji: $APP_URL"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Nowa wersja nie pojawiła się w ciągu 20 minut."
          exit 1
